# =============================================================================
# PrintTrek — packages/sensor-sht3x.yaml
# -----------------------------------------------------------------------------
# SHT3x temperature / relative-humidity sensor (I2C) for the trailer interior
# (condensation and mould watch — the dew-point sensor in the HA package is
# derived from these two).
# Requires: packages/bus-i2c.yaml (bus id `bus_a`).
#
# Substitutions:
#   sht3x_address          I2C address (default: 0x44; ADDR pin high: 0x45)
#   sht3x_update_interval  Sample rate — sampling is local and cheap
#                          (default: 30s)
#   sht3x_temp_id          Sensor id (default: interior_temperature)
#   sht3x_rh_id            Sensor id (default: interior_humidity)
#
# Provides:
#   sensor ids ${sht3x_temp_id} (degC), ${sht3x_rh_id} (%)
# =============================================================================

substitutions:
  sht3x_address: "0x44"
  sht3x_update_interval: 30s
  sht3x_temp_id: interior_temperature
  sht3x_rh_id: interior_humidity

sensor:
  - platform: sht3xd
    i2c_id: bus_a
    address: ${sht3x_address}
    update_interval: ${sht3x_update_interval}
    temperature:
      name: Interior Temperature
      id: ${sht3x_temp_id}
      accuracy_decimals: 1
    humidity:
      name: Interior Humidity
      id: ${sht3x_rh_id}
      accuracy_decimals: 0
