# =============================================================================
# PrintTrek — Home Assistant package
# -----------------------------------------------------------------------------
# Drop into <config>/packages/ (enable packages in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# ) and import homeassistant/blueprints/automation/printtrek/ as blueprints.
# The dev stack in server/docker-compose.yml mounts this directory already.
#
# All device entities are auto-created by MQTT discovery — this package only
# ADDS value on top: a radio-window binary sensor, derived template sensors,
# staleness detection, and alerts.
#
# ENTITY IDS: discovery derives ids from the node/friendly name. This file
# assumes node_name "printtrek-trailer" (entity ids like
# sensor.printtrek_trailer_battery_voltage). If you renamed the node, check
# Developer Tools -> States and adjust.
#
# The trailer node keeps its radio ALWAYS ON by default, so switches react
# immediately like any ESPHome device. When "Radio Always On" is off
# (storage mode) the node duty-cycles (docs/PROTOCOL.md): entities do NOT go
# "unavailable" while the radio sleeps — they keep their retained state, and
# setpoint edits made in HA are retained by the broker and applied at the
# next radio window (<= 10 min normally, <= 60 min in deep load-shed).
# "Offline" therefore means: no radio window for much longer than the
# beacon interval.
# =============================================================================

mqtt:
  binary_sensor:
    # Live view of the radio duty cycle (the device's LWT topic).
    - name: PrintTrek radio window
      unique_id: printtrek_radio_window
      state_topic: printtrek/printtrek-trailer/status
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity
      icon: mdi:wifi-sync

template:
  - sensor:
      # Dew point via Magnus formula — condensation/mould risk indicator
      # for the closed-up trailer body.
      - name: PrintTrek dew point
        unique_id: printtrek_dew_point
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {% set t = states('sensor.printtrek_trailer_interior_temperature') | float(none) %}
          {% set rh = states('sensor.printtrek_trailer_interior_humidity') | float(none) %}
          {% if t is not none and rh is not none and rh > 0 %}
            {% set gamma = (17.62 * t / (243.12 + t)) + log(rh / 100) %}
            {{ (243.12 * gamma / (17.62 - gamma)) | round(1) }}
          {% else %}
            unknown
          {% endif %}

      # Rough LiFePO4 state-of-charge estimate from resting voltage.
      # Coarse by nature (the LiFePO4 curve is flat) — trend, not gauge.
      # The shunt's battery_current tells you charge vs discharge live.
      - name: PrintTrek battery SoC estimate
        unique_id: printtrek_battery_soc
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set v = states('sensor.printtrek_trailer_battery_voltage') | float(none) %}
          {% if v is none %}
            unknown
          {% else %}
            {% set curve = [(12.0, 0), (12.8, 10), (12.9, 20), (13.0, 30),
                            (13.1, 40), (13.2, 70), (13.3, 90), (13.4, 99),
                            (13.6, 100)] %}
            {% set ns = namespace(soc=100) %}
            {% if v <= curve[0][0] %}
              {% set ns.soc = 0 %}
            {% else %}
              {% for i in range(1, curve | length) %}
                {% if v <= curve[i][0] and v > curve[i-1][0] %}
                  {% set lo = curve[i-1] %}
                  {% set hi = curve[i] %}
                  {% set ns.soc = lo[1] + (hi[1] - lo[1]) * (v - lo[0]) / (hi[0] - lo[0]) %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.soc | round(0) }}
          {% endif %}

  - binary_sensor:
      # The fridge is powered but not cold — door ajar, compressor fault,
      # or it was just loaded with warm food.
      - name: PrintTrek fridge warm
        unique_id: printtrek_fridge_warm
        device_class: problem
        state: >-
          {{ is_state('binary_sensor.printtrek_trailer_fridge_power', 'on')
             and states('sensor.printtrek_trailer_fridge_temperature') | float(-99) > 8.0 }}

  # Staleness: uptime is published on every radio window and always changes,
  # so its last_updated is the device's true "last seen". The trigger makes
  # this re-evaluate every 5 minutes. 90 min = 1.5x the tier-3 hourly beacon.
  - trigger:
      - platform: time_pattern
        minutes: "/5"
    binary_sensor:
      - name: PrintTrek telemetry stale
        unique_id: printtrek_telemetry_stale
        device_class: problem
        state: >-
          {% set last = states.sensor.printtrek_trailer_uptime.last_updated
             if states.sensor.printtrek_trailer_uptime else none %}
          {{ last is none or (now() - last).total_seconds() > 5400 }}

automation:
  - alias: "PrintTrek: low battery alert"
    id: printtrek_low_battery_alert
    use_blueprint:
      path: printtrek/numeric_below_alert.yaml
      input:
        entity: sensor.printtrek_trailer_battery_voltage
        below: 12.4
        for_minutes: 10
        title: "PrintTrek: low battery"
        message: >-
          Trailer battery is low — load shedding is active.
          The fridge still runs; pump and lights are curtailed.
        notify_service: notify.notify

  - alias: "PrintTrek: water low alert"
    id: printtrek_water_low_alert
    use_blueprint:
      path: printtrek/numeric_below_alert.yaml
      input:
        entity: sensor.printtrek_trailer_water_level
        below: 15
        for_minutes: 10
        title: "PrintTrek: water low"
        message: >-
          Tank below 15 percent — the pump cuts out at the low-water
          cutoff. Plan a refill.
        notify_service: notify.notify

  - alias: "PrintTrek: fridge warm alert"
    id: printtrek_fridge_warm_alert
    mode: single
    trigger:
      # Long dwell: loading warm groceries legitimately takes a while.
      - platform: state
        entity_id: binary_sensor.printtrek_fridge_warm
        to: "on"
        for:
          minutes: 45
    action:
      - service: notify.notify
        data:
          title: "PrintTrek: fridge warm"
          message: >-
            Fridge is powered but has been above 8 C for 45 minutes —
            check the door, the compressor, and the 12 V supply.

  - alias: "PrintTrek: trailer offline alert"
    id: printtrek_offline_alert
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.printtrek_telemetry_stale
        to: "on"
        for:
          minutes: 5
    action:
      - service: notify.notify
        data:
          title: "PrintTrek: trailer offline"
          message: >-
            No telemetry for over 90 minutes — the node missed even the
            tier-3 beacon. Check power and the router. The trailer keeps
            controlling itself locally, but you are flying blind.
